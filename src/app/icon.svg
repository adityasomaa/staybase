<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon lockup: the mark reversed out of the brand blue.

    A tab icon has no theme to inherit and sits on browser chrome that may be
    light or dark, so the background is carried here rather than left to the
    page. Solid fill also survives 16px, where a stroked outline on transparent
    turns to mush.
  -->
  <rect width="32" height="32" rx="7" fill="#1668FF"/>
  <g fill="none" stroke="#FFFFFF" stroke-linejoin="round">
    <path d="M16 5.6 25 10.8v10.4L16 26.4 7 21.2V10.8z" stroke-width="1.9"/>
    <path d="M12.5 14.6 16 11.7l3.5 2.9" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="14.35" y="13.7" width="1.35" height="1.35" rx="0.3"/>
    <rect x="16.3" y="13.7" width="1.35" height="1.35" rx="0.3"/>
    <rect x="14.35" y="15.65" width="1.35" height="1.35" rx="0.3"/>
    <rect x="16.3" y="15.65" width="1.35" height="1.35" rx="0.3"/>
  </g>
  <path d="M20.6 19.2c-1.4-1-6.5-1-7.6.3-.8 1 .5 2 3.2 2.1 2.7.2 4.2 1.1 3.4 2.2-1 1.4-5.8 1.5-7.3.4"
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
